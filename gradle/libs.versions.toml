[versions]
ktor = "3.2.3"
sykepengerGradlePlugins = "20261001.1830"

[libraries]
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt-jvm", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }

jackson-module-kotlin = "com.fasterxml.jackson.module:jackson-module-kotlin:2.22.3"

logback-classic = "ch.qos.logback:logback-classic:1.6.4"
logstash-logback-encoder = "net.logstash.logback:logstash-logback-encoder:8.0"

tbdLibs-signedJwt = "com.github.navikt.tbd-libs:signed-jwt:2026.01.22-09.16-1d3f6039"

[bundles]
ktor-server = [
    "ktor-server-auth",
    "ktor-server-cio",
    "ktor-server-core"
]

[plugins]
sykepenger-deployable = { id = "no.nav.sykepenger.deployable", version.ref = "sykepengerGradlePlugins" }
