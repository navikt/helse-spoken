[versions]
ktor = "3.6.0"
sykepengerGradlePlugins = "20261028.1441"

[libraries]
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt-jvm", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }

jackson-module-kotlin = "com.fasterxml.jackson.module:jackson-module-kotlin:2.22.4"

logback-classic = "ch.qos.logback:logback-classic:1.6.5"
logstash-logback-encoder = "net.logstash.logback:logstash-logback-encoder:9.0"

tbdLibs-signedJwt = "com.github.navikt.tbd-libs:signed-jwt:20261013.1613"

[bundles]
ktor-server = [
    "ktor-server-auth",
    "ktor-server-cio",
    "ktor-server-core"
]

[plugins]
sykepenger-deployable = { id = "no.nav.sykepenger.deployable", version.ref = "sykepengerGradlePlugins" }
